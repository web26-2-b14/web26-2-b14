<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2reportcss</title>
    <style>
        *{
            margin: 0; padding: 0;
            font-family: '맑은 고딕', 'Malgun Gothic',Gothic,sans-serief;
        }

        a{text-decoration: none;}

        li{list-style: none;}
    </style>
    
    <style>
        .pull-left{float: left;}
        .pull-right{float: right;}
    </style>
    
    <style>
        body{
            width: 960px;margin: 0 auto;
            background: #e6e6e6;
        }
        #page-wrapper{
            background: white;
            margin: 40px 0;padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(100,100,100,0.3);
        }
    </style>

    <style>
        #main-header{padding: 40px 50px;}

        .master-title{
            font-size: 30px;
            color:#181818;
        }
        .master-description{
            font-size: 15px; font-weight: 500;
            color: #383838;
        }
    </style>

    <style>
        #main-navigation{
            border-top: 1px solid #c8c8c8;
            border-bottom : 1px solid #c8c8c8;
            margin-bottom : 20px;
            height : 40px;
        }
        .outer-menu-item{
            float: left;
            position: relative;
        }
        .outer-menu-item:hover{
            background: black;
            color: white;
        }
        .menu-title{
            display: block;
            height: 30px; line-height: 30px;
            text-align: center;
            padding: 5px 20px;
        }
        .inner-menu{
            display: none;
            position: absolute;
            top: 40px; left: 0;
            width: 100%;
            background: white;
            box-shadow: 0 2px 6px rgba(5,5,5,0.9);
            z-index: 1000;
            text-align: center;
        }
        .inner-menu-item > a{
            display: block;
            padding: 5px 10px;
            color: black;
        }
        .inner-menu-item > a:hover{
            background: black;
            color: white;
        }
    </style>

    <style>
        .search-bar{
            height: 26px;
            padding: 7px;
        }
        .input-search{
            display: block;
            float: left;
            background-color: #FFFFFF;
            border: 1px solid #CCCCCC;
            border-radius: 15px 0 0 15px;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.05);
            width: 120px; height: 24px;
            padding: 0 0 0 10px;
            font-size: 12px;
            color: #555555;
        }
        .input-search:focus{
            border-color: rgba(82,168,236,0.8);
            outline: 0;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.05);
        }
        .input-search-submit{
            display: block;
            float: left;
            width: 50px; height: 26px;
            border-radius: 0 15px 15px 0;
            border: 1px solid #CCCCCC;
            margin-left: -1px;
            vertical-align: top;
            display: inline-block;
        }
    </style>

    <style>
        #content {overflow: hidden;}
        #main-section{
            float: left;
            width: 710px;
        }
        #main-aside{
            float: right;
            width: 200px;
        }
    </style>

    <style>
        article{
            padding: 0  10px 20px 10px;
            border-bottom: 1px solid #c8c8c8;
        }
        .article-header{
            padding:20px 0;
        }
        .article-title{
            font-size: 25px;
            font-weight: 500;
            padding-bottom: 10px;
        }
        .article-date{font-size: 13px;}
        .article-body{
            font-size: 14px;
        }
    </style>

    <style>
        .aside-list{padding: 10px 0 30px 0;}
        .aside-list > h3{
            font-size: 15px;
            font-weight: 600;
        }
        .aside-list li a{
            margin-left: 8px;
            font-size: 13px;
            color: #6C6C6C;
        }
    </style>
</head>
<body>
    <div id="page-wrapper">
        <!-- 헤더 영역 -->
        <header id="main-header">
            <hgroup>
                <h1 class="master-title">HTML5 & CSS3 Basic</h1>
                <h2 class="master-description">웹 퍼블리싱 기본 레이아웃 연습</h2>
            </hgroup>
        </header>

        <!-- 네비게이션 영역 -->
        <nav id="main-navigation">
            <div class="pull-left">
                <ul class="outer-menu">
                    <li class="outer-menu-item">
                        <a href="#" class="menu-title">메뉴 1</a>
                    </li>
                    <li class="outer-menu-item">
                        <a href="#" class="menu-title">메뉴 2</a>
                    </li>
                </ul>
            </div>
            <div class="pull-right">
                <form class="search-bar">
                    <input type="text" class="input-search" placeholder="검색어 입력">
                    <input type="submit" class="input-search-submit" value="검색">
                </form>
            </div>
        </nav>

        <!-- 본문 콘텐츠 영역 -->
        <div id="content">
            <section id="main-section">
                <article>
                    <div class="article-header">
                        <h1 class="article-title">첫 번째 게시글 제목</h1>
                        <p class="article-date">2026-03-30</p>
                    </div>
                    <div class="article-body">
                        <p>여기에 본문 내용이 들어갑니다. 스타일 시트가 정상적으로 적용되었는지 확인해보세요.</p>
                    </div>
                </article>
            </section>
            
            <aside id="main-aside">
                <div class="aside-list">
                    <h3>카테고리</h3>
                    <ul>
                        <li><a href="#">HTML</a></li>
                        <li><a href="#">CSS</a></li>
                        <li><a href="#">JavaScript</a></li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>
</body>
</html>
