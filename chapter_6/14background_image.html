<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>3.배경속성</title>
    <style>
        body {/*배경이미지 1개 삽입*/
            /*background-image: url('BackgroundBack.png');*/
            background-image: url('BackgroundFront.png'),
            url('BackgroundBack.png');
           /* background-size: 70%;너비 조정*/
            background-size: 100% 250px;  /*이미지 높이 조정*/
        }
    </style>

</head>

<body>
    <h2>6.3.1 배경 이미지 삽입과 크기 지정(예제6-14 ~ 6-18)</h2>
    <h3><b>. background-image: 배경 이미지 삽입</b></h3>
    <h3><b>. background-size: 배경 이미지 크기 지정</b></h3>
    <h3>. background-repeat: 배경 이미지 형태 지정</h3>
    <h3>. background-attachment: 배경 이미지 부착 형태 지정</h3>
    <h3>. background-position: 배경 이미지 위치 지정</h3>
    <h3>. background: 한번에 모든 배경 속성 입력</h3>

    <hr>

</body>

</html>
